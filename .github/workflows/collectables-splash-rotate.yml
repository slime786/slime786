name: Rotate Collectables Splash

on:
  schedule:
    - cron: "17 14 * * 3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rotate preset every 3 weeks
        shell: bash
        run: |
          set -euo pipefail
          FILE="collectables/index.html"

          current=$(grep -o 'data-splash-preset="[123]"' "$FILE" | head -n1 | grep -o '[123]' || true)
          if [ -z "$current" ]; then
            echo "No splash preset found; stopping safely."
            exit 0
          fi

          # Anchor the cadence to the current ISO week. The workflow checks weekly,
          # but only makes a change during weeks divisible by 3.
          week=$(date -u +%V)
          week=$((10#$week))
          if (( week % 3 != 0 )); then
            echo "Week $week is not a rotation week; no change."
            exit 0
          fi

          case "$current" in
            1) next=2 ;;
            2) next=3 ;;
            3) next=1 ;;
          esac

          sed -i "s/data-splash-preset=\"$current\"/data-splash-preset=\"$next\"/" "$FILE"

          if git diff --quiet -- "$FILE"; then
            echo "No change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Rotate collectables splash preset to $next"
          git push
