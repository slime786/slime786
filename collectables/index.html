<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Welcome to Slime's Collectables — a personal UK Yu-Gi-Oh! and Pokémon TCG collection shop.">
  <meta name="theme-color" content="#05090a">
  <title>Welcome — Slime's Collectables</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#f7f8f4;--muted:#a7b3ae;--green:#88ff5a;--gold:#ffc85a}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#05090a;color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}
    body{
      min-height:100svh;
      display:grid;
      place-items:center;
      overflow:hidden;
      background:
        radial-gradient(circle at 18% 22%,rgba(255,157,74,.12),transparent 28%),
        radial-gradient(circle at 82% 26%,rgba(79,255,124,.14),transparent 30%),
        radial-gradient(circle at 50% 105%,rgba(68,91,255,.10),transparent 34%),
        linear-gradient(145deg,#040708,#08110e 58%,#05080a)
    }
    .splash{
      position:relative;
      width:min(920px,100%);
      min-height:100svh;
      padding:2rem 1.25rem;
      display:grid;
      place-items:center;
      text-align:center;
      overflow:hidden
    }
    .splash:before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px),
        linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px);
      background-size:72px 72px;
      mask-image:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent)
    }
    .content{position:relative;z-index:1;width:100%;max-width:760px}
    .kicker{margin:0 0 .9rem;color:#c8aa68;font-size:.7rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
    .logo-wrap{position:relative;margin:0 auto;max-width:720px}
    .logo-wrap:before{content:"";position:absolute;inset:15% 8%;z-index:-1;background:radial-gradient(circle,rgba(112,255,77,.22),transparent 70%);filter:blur(32px)}
    .logo{display:block;width:100%;height:auto;filter:drop-shadow(0 24px 46px rgba(0,0,0,.5))}
    h1{font-family:"DM Serif Display";font-weight:400;font-size:clamp(2.3rem,5vw,4.5rem);line-height:1;margin:.45rem 0 .85rem}
    h1 em{font-style:normal;color:var(--green);text-shadow:0 0 22px rgba(136,255,90,.2)}
    .message{max-width:620px;margin:0 auto;color:#bcc8c3;font-size:clamp(.96rem,1.8vw,1.08rem);line-height:1.65}
    .cta{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:230px;
      min-height:54px;
      margin-top:1.8rem;
      padding:.95rem 1.4rem;
      border-radius:14px;
      border:1px solid #93ff6a;
      background:linear-gradient(180deg,#9cff70,#5be844);
      color:#071506;
      text-decoration:none;
      font-weight:800;
      box-shadow:0 0 32px rgba(93,255,71,.2);
      transition:.2s transform,.2s box-shadow
    }
    .cta:hover{transform:translateY(-2px);box-shadow:0 0 38px rgba(93,255,71,.3)}
    .meta{margin-top:1rem;color:#7f9089;font-size:.74rem;letter-spacing:.05em}
    .corner{position:absolute;width:70px;height:100px;border-radius:9px;border:2px solid #314b41;background:linear-gradient(145deg,#0e1716,#152425);opacity:.35;box-shadow:0 0 24px rgba(79,255,124,.06)}
    .c1{left:4%;top:20%;transform:rotate(-11deg)}.c2{right:5%;bottom:18%;transform:rotate(10deg)}
    @media(max-width:600px){
      .splash{padding:1.2rem .95rem}
      .kicker{font-size:.62rem}
      h1{font-size:2.65rem}
      .message{font-size:.94rem}
      .cta{width:100%;max-width:340px}
      .corner{width:48px;height:70px;opacity:.2}
    }
  </style>
</head>
<body>
  <main class="splash">
    <i class="corner c1" aria-hidden="true"></i>
    <i class="corner c2" aria-hidden="true"></i>

    <section class="content" aria-labelledby="welcome-title">
      <p class="kicker">WELCOME TO THE COLLECTION</p>

      <div class="logo-wrap">
        <img class="logo" src="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/82b9037255f7a1c2a644d619c0f34ba2657bfab0a22bef0d5dafdf104016cc9e.png" alt="Slime's Collectables">
      </div>

      <h1 id="welcome-title">Collect what makes <em>you happy.</em></h1>
      <p class="message">A personal collection of Yu-Gi-Oh! and Pokémon cards, sealed products and collector pieces — from my shelf to yours.</p>

      <a class="cta" href="/slime786/collectables/shop.html">Enter Site →</a>

      <p class="meta">UK only · Collector run · Honest listings</p>
    </section>
  </main>
</body>
</html>
