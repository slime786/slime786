<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Welcome to Slime's Collectables — a personal UK Yu-Gi-Oh! and Pokémon TCG collection shop.">
  <meta name="theme-color" content="#030608">
  <title>Welcome — Slime's Collectables</title>
  <style>
    :root{--bg:#030608;--glow:#7dff55;--ink:#eef5ef}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    body{min-height:100svh;overflow:hidden}

    .splash{
      position:relative;
      min-height:100svh;
      display:grid;
      place-items:center;
      overflow:hidden;
      background:
        radial-gradient(circle at 20% 42%,rgba(255,70,100,.16),transparent 26%),
        radial-gradient(circle at 80% 40%,rgba(60,185,255,.16),transparent 26%),
        radial-gradient(circle at 50% 88%,rgba(125,255,85,.10),transparent 28%),
        linear-gradient(180deg,#020405 0%,#05090b 100%);
    }
    .splash::before{
      content:"";
      position:absolute;
      inset:-12%;
      pointer-events:none;
      background:
        radial-gradient(circle at 34% 34%,rgba(255,107,138,.08),transparent 18%),
        radial-gradient(circle at 65% 25%,rgba(114,95,255,.08),transparent 18%),
        radial-gradient(circle at 72% 68%,rgba(83,188,255,.08),transparent 18%);
      filter:blur(24px);
      animation:ambient 14s ease-in-out infinite alternate;
    }

    .stage{
      position:relative;
      width:min(96vw,calc(96svh * 1.5));
      aspect-ratio:3/2;
      max-height:96svh;
      border-radius:24px;
      overflow:hidden;
      box-shadow:0 24px 70px rgba(0,0,0,.55);
      animation:stageIn .75s cubic-bezier(.2,.8,.2,1) both;
      isolation:isolate;
    }
    .hero{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      user-select:none;
      -webkit-user-drag:none;
    }
    .stage::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:linear-gradient(180deg,rgba(0,0,0,.04),transparent 24%,transparent 76%,rgba(0,0,0,.12));
    }

    .enter-hotspot{
      position:absolute;
      z-index:4;
      left:50%;
      top:52.4%;
      width:28.5%;
      height:8.2%;
      transform:translate(-50%,-50%);
      border-radius:999px;
      text-decoration:none;
      outline:none;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .enter-hotspot::before{
      content:"";
      position:absolute;
      inset:-5px;
      border-radius:inherit;
      box-shadow:0 0 0 1px rgba(139,255,106,.28),0 0 24px rgba(89,255,83,.18),0 0 40px rgba(89,255,83,.12);
      opacity:.48;
      animation:buttonPulse 3.3s ease-in-out infinite;
    }
    .enter-hotspot::after{
      content:"";
      position:absolute;
      inset:-11px;
      border-radius:inherit;
      opacity:0;
      box-shadow:0 0 0 2px rgba(160,255,128,.92),0 0 40px rgba(97,255,89,.48);
      transition:opacity .18s ease;
    }
    .enter-hotspot:hover::after,
    .enter-hotspot:focus-visible::after{opacity:1}

    .mobile-enter{display:none}

    @media(max-width:760px),(max-aspect-ratio:4/3){
      body{overflow:auto}
      .splash{padding:0 0 5.4rem}
      .stage{width:100vw;height:auto;max-height:none;border-radius:0;box-shadow:none}
      .enter-hotspot{display:none}
      .mobile-enter{
        display:inline-flex;
        position:fixed;
        z-index:10;
        left:50%;
        bottom:max(1rem,env(safe-area-inset-bottom));
        transform:translateX(-50%);
        align-items:center;
        justify-content:center;
        min-width:220px;
        min-height:54px;
        padding:.95rem 1.4rem;
        border-radius:999px;
        border:1px solid #8fff5b;
        background:linear-gradient(180deg,#a9ff80,#67ee49);
        color:#051105;
        text-decoration:none;
        font-weight:800;
        box-shadow:0 0 28px rgba(97,255,89,.25);
        animation:buttonPulseMobile 3.3s ease-in-out infinite;
      }
    }

    @media(prefers-reduced-motion:reduce){
      .splash::before,.stage,.enter-hotspot::before,.mobile-enter{animation:none!important}
    }

    @keyframes ambient{
      from{transform:translate3d(0,0,0) scale(1)}
      to{transform:translate3d(1.5%,-1.5%,0) scale(1.04)}
    }
    @keyframes stageIn{
      from{opacity:0;transform:scale(.985);filter:blur(5px)}
      to{opacity:1;transform:scale(1);filter:blur(0)}
    }
    @keyframes buttonPulse{
      0%,100%{opacity:.40;transform:scale(.99)}
      50%{opacity:.78;transform:scale(1.018)}
    }
    @keyframes buttonPulseMobile{
      0%,100%{box-shadow:0 0 20px rgba(97,255,89,.18)}
      50%{box-shadow:0 0 34px rgba(97,255,89,.34)}
    }
  </style>
</head>
<body>
  <main class="splash" aria-label="Slime's Collectables welcome page">
    <section class="stage">
      <img
        class="hero"
        src="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/4f56b62123a8f63c5b2593a24ef1fb00c7ef84a62189889a1bfd658fdf28cae9.png"
        alt="Slime's Collectables promotional splash artwork">
      <a class="enter-hotspot" href="/slime786/collectables/shop.html" aria-label="Enter Slime's Collectables shop"></a>
    </section>
    <a class="mobile-enter" href="/slime786/collectables/shop.html">Enter Site →</a>
  </main>
</body>
</html>
