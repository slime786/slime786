<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Welcome to Slime's Collectables — a personal UK Yu-Gi-Oh! and Pokémon TCG collection shop.">
  <meta name="theme-color" content="#05090a">
  <title>Welcome — Slime's Collectables</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#f7f8f4;--muted:#a9b6b0;--green:#8dff5e;--gold:#ffd35a;
      --ygo:#ff4d6d;--ygo2:#7c245e;--pkm:#35b4ff;--pkm2:#ffd74f
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#040708;color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}
    body{min-height:100svh;overflow:hidden}
    .splash{
      position:relative;min-height:100svh;display:grid;place-items:center;
      padding:2rem 1.15rem;text-align:center;isolation:isolate;overflow:hidden;
      background:
        radial-gradient(circle at 15% 45%,rgba(255,55,92,.10),transparent 28%),
        radial-gradient(circle at 84% 42%,rgba(53,180,255,.11),transparent 30%),
        radial-gradient(circle at 50% 76%,rgba(95,255,85,.07),transparent 34%),
        linear-gradient(145deg,#030506 0%,#07100d 52%,#04070a 100%)
    }
    .splash:before{
      content:"";position:absolute;inset:-20%;z-index:-4;
      background:
        radial-gradient(circle at 30% 30%,rgba(112,255,77,.10),transparent 24%),
        radial-gradient(circle at 70% 70%,rgba(75,93,255,.08),transparent 28%);
      animation:ambientDrift 13s ease-in-out infinite alternate
    }
    .splash:after{
      content:"";position:absolute;inset:0;z-index:-3;pointer-events:none;
      background:
        linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px),
        linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px);
      background-size:74px 74px;
      mask-image:linear-gradient(180deg,transparent,#000 15%,#000 85%,transparent)
    }

    .world{
      position:absolute;top:50%;width:min(32vw,400px);height:min(72vh,660px);
      transform:translateY(-50%);z-index:-1;pointer-events:none
    }
    .world-ygo{left:1.2vw}.world-pkm{right:1.2vw}
    .world-glow{
      position:absolute;inset:10% 2%;border-radius:50%;filter:blur(42px);opacity:.42;
      animation:glowPulse 4.6s ease-in-out infinite
    }
    .world-ygo .world-glow{background:radial-gradient(circle,var(--ygo),rgba(124,36,94,.45) 38%,transparent 70%)}
    .world-pkm .world-glow{background:radial-gradient(circle,var(--pkm),rgba(255,215,79,.32) 38%,transparent 70%);animation-delay:-2s}
    .world-label{
      position:absolute;left:50%;top:8%;transform:translateX(-50%);
      font-size:.62rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap
    }
    .world-ygo .world-label{color:#ffb1bf;text-shadow:0 0 18px rgba(255,77,109,.45)}
    .world-pkm .world-label{color:#a9dbff;text-shadow:0 0 18px rgba(53,180,255,.45)}
    .cards{position:absolute;inset:15% 0 8%;perspective:900px;transform-style:preserve-3d}
    .visual-card{
      --r:0deg;--delay:0s;
      position:absolute;width:80px;height:116px;border-radius:10px;border:1px solid rgba(255,255,255,.28);
      background:#101415;box-shadow:0 20px 42px rgba(0,0,0,.48),0 0 22px rgba(255,255,255,.06);
      overflow:hidden;opacity:.38;z-index:1;transform-style:preserve-3d;
      animation:cardDrift 7.5s ease-in-out infinite var(--delay)
    }
    .visual-card:before{
      content:"";position:absolute;inset:-45% -110%;z-index:3;pointer-events:none;
      background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.44) 49%,rgba(255,255,255,.12) 54%,transparent 62%);
      transform:translateX(-55%) rotate(8deg);animation:cardSheen 5.8s ease-in-out infinite var(--delay)
    }
    .visual-card:after{
      content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
      border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 -18px 30px rgba(0,0,0,.12)
    }
    .world-ygo .visual-card{border-color:#a63757;box-shadow:0 20px 35px rgba(0,0,0,.42),0 0 25px rgba(255,77,109,.13)}
    .world-ygo .visual-card:before{background:radial-gradient(circle at 50% 42%,rgba(255,82,130,.28),transparent 23%),linear-gradient(145deg,#3e1727,#18131f)}
    .world-pkm .visual-card{border-color:#3f8ec0;box-shadow:0 20px 35px rgba(0,0,0,.42),0 0 25px rgba(53,180,255,.13)}
    .world-pkm .visual-card:before{background:radial-gradient(circle at 50% 42%,rgba(255,214,79,.27),transparent 23%),linear-gradient(145deg,#113c5b,#152c47)}
    .visual-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
    .character-art{position:absolute;display:block;max-width:none;z-index:3;filter:drop-shadow(0 20px 28px rgba(0,0,0,.58));animation:characterFloat 6.8s ease-in-out infinite}
    .ygo-blue{width:188px;left:-4px;top:50%;animation-delay:-.4s}
    .ygo-dark{display:none}
    .ygo-red{width:118px;right:5px;top:71%;animation-delay:-1.5s}
    .pkm-charizard{width:154px;right:0;top:51%;animation-delay:-.8s}
    .pkm-mew{width:92px;left:8px;top:10%;animation-delay:-2.8s;filter:drop-shadow(0 18px 24px rgba(255,145,215,.18))}
    .pkm-pikachu{width:82px;left:118px;top:73%;animation-delay:-1.7s;filter:drop-shadow(0 18px 24px rgba(255,220,70,.18))}
    .world-ygo .card-a{left:3%;top:25%;--r:-14deg;--delay:-.6s}
    .world-ygo .card-b{display:block;left:38%;top:9%;--r:5deg;--delay:-2.6s}
    .world-ygo .card-c{display:block;right:3%;top:34%;--r:13deg;--delay:-4.4s}
    .world-pkm .card-a{display:block;right:2%;left:auto;top:23%;--r:14deg;--delay:-.9s}
    .world-pkm .card-b{display:block;left:39%;top:8%;--r:-5deg;--delay:-2.9s}
    .world-pkm .card-c{display:block;left:3%;right:auto;top:36%;--r:-13deg;--delay:-4.7s}

    .orb{
      position:absolute;left:50%;top:59%;width:88px;height:88px;border-radius:50%;opacity:.28;
      transform:translate(-50%,-50%);animation:orbSpin 14s linear infinite
    }
    .world-ygo .orb{
      border:1px solid rgba(255,98,135,.55);
      box-shadow:0 0 28px rgba(255,77,109,.2),inset 0 0 26px rgba(124,36,94,.28)
    }
    .world-ygo .orb:before,.world-ygo .orb:after{
      content:"";position:absolute;inset:15%;border:1px solid rgba(255,150,173,.38);transform:rotate(45deg)
    }
    .world-ygo .orb:after{inset:30%;transform:rotate(0deg);border-radius:50%}
    .world-pkm .orb{
      background:linear-gradient(180deg,rgba(53,180,255,.24) 0 48%,rgba(10,14,20,.9) 48% 54%,rgba(255,215,79,.22) 54% 100%);
      border:1px solid rgba(111,202,255,.55);box-shadow:0 0 28px rgba(53,180,255,.2)
    }
    .world-pkm .orb:before{
      content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;border-radius:50%;
      transform:translate(-50%,-50%);border:5px solid #17202a;background:#dce9ee;box-shadow:0 0 18px rgba(255,215,79,.35)
    }

    .spark{position:absolute;width:4px;height:4px;border-radius:50%;opacity:.72;animation:spark 4.5s ease-in-out infinite}
    .world-ygo .spark{background:#ff839b;box-shadow:0 0 12px #ff4d6d}
    .world-pkm .spark{background:#ffe06b;box-shadow:0 0 12px #35b4ff}
    .s1{left:12%;top:22%;animation-delay:-.4s}.s2{right:15%;top:19%;animation-delay:-2.2s}
    .s3{left:22%;bottom:18%;animation-delay:-3.5s}.s4{right:24%;bottom:10%;animation-delay:-1.3s}
    .s5{left:50%;top:4%;animation-delay:-2.8s}

    .content{
      position:relative;z-index:3;width:min(760px,100%);
      animation:contentIn .9s cubic-bezier(.2,.8,.2,1) both
    }
    .kicker{margin:0 0 .8rem;color:#c9aa68;font-size:.68rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
    .logo-wrap{position:relative;margin:0 auto;max-width:700px}
    .logo-wrap:before{
      content:"";position:absolute;inset:11% 7%;z-index:-1;
      background:radial-gradient(circle,rgba(119,255,78,.25),rgba(50,207,101,.07) 45%,transparent 72%);
      filter:blur(32px);animation:logoPulse 4s ease-in-out infinite
    }
    .logo{
      display:block;width:100%;height:auto;
      filter:drop-shadow(0 24px 46px rgba(0,0,0,.52));
      animation:logoFloat 6s ease-in-out infinite
    }
    h1{
      font-family:"DM Serif Display";font-weight:400;font-size:clamp(2.4rem,5vw,4.55rem);
      line-height:1;margin:.3rem 0 .8rem;text-shadow:0 12px 30px rgba(0,0,0,.34)
    }
    h1 em{font-style:normal;color:var(--green);text-shadow:0 0 24px rgba(141,255,94,.22)}
    .message{max-width:600px;margin:0 auto;color:#bdc9c4;font-size:clamp(.95rem,1.7vw,1.06rem);line-height:1.65}
    .cta{
      position:relative;display:inline-flex;align-items:center;justify-content:center;
      min-width:238px;min-height:55px;margin-top:1.75rem;padding:.95rem 1.45rem;
      border-radius:15px;border:1px solid #99ff71;
      background:linear-gradient(180deg,#9fff72,#5ce746);color:#061506;
      text-decoration:none;font-weight:800;overflow:hidden;
      box-shadow:0 0 32px rgba(93,255,71,.22);
      transition:.2s transform,.2s box-shadow;animation:ctaBreathe 3.2s ease-in-out infinite
    }
    .cta:before{
      content:"";position:absolute;top:-35%;left:-45%;width:28%;height:170%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);
      transform:skewX(-18deg);animation:ctaShine 4s ease-in-out infinite
    }
    .cta:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 0 42px rgba(93,255,71,.35)}
    .meta{margin-top:1rem;color:#81918a;font-size:.74rem;letter-spacing:.055em}

    @keyframes ambientDrift{to{transform:translate3d(3%,-2%,0) scale(1.04)}}
    @keyframes glowPulse{50%{opacity:.68;transform:scale(1.08)}}
    @keyframes cardFloat{0%,100%{margin-top:0}50%{margin-top:-16px}}
    @keyframes cardDrift{
      0%,100%{transform:translate3d(0,0,0) rotateZ(var(--r)) rotateX(1deg) rotateY(-6deg)}
      50%{transform:translate3d(4px,-17px,0) rotateZ(calc(var(--r) + 2deg)) rotateX(-2deg) rotateY(8deg)}
    }
    @keyframes cardSheen{0%,62%{transform:translateX(-60%) rotate(8deg);opacity:0}76%{opacity:.9}100%{transform:translateX(65%) rotate(8deg);opacity:0}}
    @keyframes characterFloat{
      0%,100%{transform:translate3d(0,0,0) rotate(-1deg) scale(1)}
      50%{transform:translate3d(5px,-14px,0) rotate(1deg) scale(1.018)}
    }
    @keyframes orbSpin{to{rotate:360deg}}
    @keyframes spark{0%,100%{opacity:.18;transform:translateY(10px) scale(.6)}50%{opacity:1;transform:translateY(-14px) scale(1.35)}}
    @keyframes logoPulse{50%{opacity:.7;transform:scale(1.06)}}
    @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes contentIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
    @keyframes ctaBreathe{0%,100%{box-shadow:0 0 27px rgba(93,255,71,.18)}50%{box-shadow:0 0 42px rgba(93,255,71,.34)}}
    @keyframes ctaShine{0%,65%{left:-45%}85%,100%{left:120%}}

    @media(max-width:980px){
      .world{width:285px;opacity:.86}.world-ygo{left:-38px}.world-pkm{right:-38px}
      .visual-card{width:62px;height:90px;opacity:.32}.orb{width:66px;height:66px}
      .ygo-blue{width:152px;left:0;top:51%}.ygo-red{width:96px;right:3px;top:72%}
      .pkm-charizard{width:132px;right:1px;top:52%}.pkm-mew{width:78px;left:13px;top:12%}.pkm-pikachu{width:72px;left:91px;top:74%}
    }
    @media(max-width:680px){
      .splash{padding:1rem .9rem}
      .world{width:176px;height:395px;opacity:.54;top:49%}
      .world-ygo{left:-56px}.world-pkm{right:-56px}
      .world-label{display:none}.visual-card{width:43px;height:62px;border-radius:7px;opacity:.18}
      .character-art{opacity:.84}
      .ygo-blue{width:96px;left:3px;top:54%}.ygo-red{width:60px;right:1px;top:75%}
      .pkm-charizard{width:82px;right:0;top:55%}.pkm-mew{width:49px;left:12px;top:16%}.pkm-pikachu{width:46px;left:72px;top:76%}
      .world-ygo .card-a{left:12%;top:31%}.world-ygo .card-b{left:48%;top:18%}.world-ygo .card-c{right:3%;top:43%}
      .world-pkm .card-a{right:4%;top:30%}.world-pkm .card-b{left:48%;top:18%}.world-pkm .card-c{left:11%;top:43%}
      .orb{width:50px;height:50px}
      .kicker{font-size:.6rem}h1{font-size:2.7rem}.message{font-size:.93rem}
      .cta{width:100%;max-width:340px}.meta{font-size:.68rem}
    }
    @media(max-width:420px){
      .world{opacity:.42}.visual-card{opacity:.14}.logo-wrap{max-width:100%}h1{font-size:2.4rem}
    }
    @media(prefers-reduced-motion:reduce){
      *,*:before,*:after{animation:none!important;scroll-behavior:auto!important}
    }
  </style>
</head>
<body>
  <main class="splash">
    <aside class="world world-ygo" aria-hidden="true">
      <div class="world-glow"></div>
      <span class="world-label">Yu-Gi-Oh! Collection</span>
      <div class="cards">
        <i class="visual-card card-a"><img src="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/94b2dc929192ec4ff720f007f722c3a84dc8dd781d4c537c5f0d997f932dc537.jpg" alt=""></i>
        <i class="visual-card card-b"><img src="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/a04782a1cc080b1bfbf8382b65b2c1f6a874b23bbd526a2597676cc19661fc11.jpg" alt=""></i>
        <i class="visual-card card-c"><img src="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/35aa5f3c475f3207116f512e3a7f3b4f8c5c68d7c5cd11b60afc073189bbff30.jpg" alt=""></i>
        <img class="character-art ygo-blue" src="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/825b612431409895ad6efa8ac27ce759570c54f8cb99ef1335413d2b42cc8486.webp" alt="">
        <img class="character-art ygo-dark" src="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/e359145101038501da27b3b81e07879c349c4111b1f0b5e291066f9aaebae0de.webp" alt="">
        <img class="character-art ygo-red" src="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/72612f4d752504a1e98484a0a057767c7218974d1c0a00b28390bf9c83ed2c8d.webp" alt="">
        <i class="orb"></i>
        <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="spark s5"></i>
      </div>
    </aside>

    <section class="content" aria-labelledby="welcome-title">
      <p class="kicker">WELCOME TO THE COLLECTION</p>
      <div class="logo-wrap">
        <img class="logo" src="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/82b9037255f7a1c2a644d619c0f34ba2657bfab0a22bef0d5dafdf104016cc9e.png" alt="Slime's Collectables">
      </div>
      <h1 id="welcome-title">Collect what makes <em>you happy.</em></h1>
      <p class="message">A personal collection of Yu-Gi-Oh! and Pokémon cards, sealed products and collector pieces — from my shelf to yours.</p>
      <a class="cta" href="/slime786/collectables/shop.html">Enter Site →</a>
      <p class="meta">UK only · Collector run · Honest listings</p>
    </section>

    <aside class="world world-pkm" aria-hidden="true">
      <div class="world-glow"></div>
      <span class="world-label">Pokémon Collection</span>
      <div class="cards">
        <i class="visual-card card-a"><img src="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/342ccb19c84339da5c137aed6e796a1cf029f226cf96ed2250989cefae36dfa0.webp" alt=""></i>
        <i class="visual-card card-b"><img src="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/cfdda8ff4300ac84a67e07b501769347e2c15f17e579827c4012b57da6feb1ed.jpg" alt=""></i>
        <i class="visual-card card-c"><img src="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/20a81b780943ad269c89d5f69892898de316e81337bd4051c372ee3a7a5e0a94.png" alt=""></i>
        <img class="character-art pkm-charizard" src="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/74af53d41ea6cd055a3412eb6c01c920469eb78fc0e6be3aa4c617e1ad4c2802.png" alt="">
        <img class="character-art pkm-mew" src="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/bbfe3b338c49de674e40fd455f27071f72ee58c49d9183110030e42bf54c5d7d.png" alt="">
        <img class="character-art pkm-pikachu" src="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/4d4181664849dc9f3ecfb2a37edbd1481c34a37b3fe99367c5eba052fb9d9014.png" alt="">
        <i class="orb"></i>
        <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="spark s5"></i>
      </div>
    </aside>
  </main>
  <script>
    (() => {
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const fine = window.matchMedia("(pointer: fine)").matches;
      if (reduce || !fine) return;
      const left = document.querySelector(".world-ygo");
      const right = document.querySelector(".world-pkm");
      const logo = document.querySelector(".logo-wrap");
      let raf = 0;
      window.addEventListener("pointermove", (event) => {
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
          const x = event.clientX / window.innerWidth - .5;
          const y = event.clientY / window.innerHeight - .5;
          left.style.transform = `translateY(-50%) translate3d(${-x * 13}px,${-y * 8}px,0)`;
          right.style.transform = `translateY(-50%) translate3d(${x * 13}px,${-y * 8}px,0)`;
          logo.style.transform = `translate3d(${x * 3}px,${y * 2}px,0)`;
        });
      }, {passive:true});
    })();
  </script>
</body>
</html>
