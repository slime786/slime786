<!doctype html>
<html lang="en" data-splash-preset="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Welcome to Slime's Collectables — a personal UK Yu-Gi-Oh! and Pokémon TCG collection shop.">
  <meta name="theme-color" content="#05090a">
  <title>Welcome — Slime's Collectables</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#030608}
    body{min-height:100svh;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
    .splash{
      position:relative;
      min-height:100svh;
      display:grid;
      place-items:center;
      overflow:hidden;
      background:
        radial-gradient(circle at 18% 42%,rgba(255,56,91,.10),transparent 28%),
        radial-gradient(circle at 82% 42%,rgba(47,164,255,.12),transparent 30%),
        #030608;
    }
    .stage{
      position:relative;
      width:min(100vw,calc(100svh * 1672 / 941));
      aspect-ratio:1672/941;
      max-height:100svh;
      overflow:hidden;
      filter:drop-shadow(0 20px 50px rgba(0,0,0,.45));
      animation:stageIn .72s cubic-bezier(.2,.8,.2,1) both;
      isolation:isolate;
    }
    .hero{
      position:relative;
      z-index:1;
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      user-select:none;
      -webkit-user-drag:none;
    }

    .energy{
      position:absolute;
      z-index:2;
      pointer-events:none;
      top:4%;
      bottom:4%;
      width:42%;
      filter:blur(24px);
      opacity:.16;
      mix-blend-mode:screen;
    }
    .energy-left{
      left:-4%;
      background:radial-gradient(circle at 34% 50%,rgba(255,52,94,.42),rgba(165,66,255,.10) 45%,transparent 73%);
      animation:redBreathe 5.8s ease-in-out infinite;
    }
    .energy-right{
      right:-4%;
      background:radial-gradient(circle at 66% 50%,rgba(45,171,255,.42),rgba(255,214,78,.08) 45%,transparent 73%);
      animation:blueBreathe 5.8s ease-in-out infinite;
    }

    .glint-zone{
      position:absolute;
      z-index:3;
      pointer-events:none;
      top:7%;
      width:39%;
      height:40%;
      overflow:hidden;
      opacity:.65;
    }
    .glint-left{left:0}
    .glint-right{right:0}
    .glint-zone::after{
      content:"";
      position:absolute;
      top:-28%;
      left:-45%;
      width:16%;
      height:160%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.30),rgba(255,255,255,.08),transparent);
      filter:blur(7px);
      transform:skewX(-18deg);
      animation:cardGlint 7.5s ease-in-out infinite;
    }
    .glint-right::after{animation-delay:-3.75s}

    .particle{
      position:absolute;
      z-index:4;
      pointer-events:none;
      width:var(--s);
      height:var(--s);
      left:var(--x);
      top:var(--y);
      border-radius:50%;
      opacity:.5;
      animation:particleDrift var(--d) ease-in-out infinite var(--delay);
    }
    .particle.left{background:#ff7293;box-shadow:0 0 9px rgba(255,68,112,.9)}
    .particle.right{background:#8fd8ff;box-shadow:0 0 9px rgba(53,180,255,.9)}
    .particle.gold{background:#ffe27d;box-shadow:0 0 9px rgba(255,211,84,.9)}

    .enter-hotspot{
      position:absolute;
      z-index:6;
      left:50%;
      top:74.1%;
      width:18.4%;
      height:8.1%;
      transform:translate(-50%,-50%);
      border-radius:20px;
      text-decoration:none;
      outline:none;
      cursor:pointer;
    }
    .enter-hotspot::before{
      content:"";
      position:absolute;
      inset:-4%;
      border-radius:22px;
      box-shadow:0 0 0 1px rgba(153,255,113,.14),0 0 14px rgba(93,255,71,.16);
      animation:buttonBreathe 3.6s ease-in-out infinite;
    }
    .enter-hotspot::after{
      content:"";
      position:absolute;
      inset:-8%;
      border-radius:22px;
      opacity:0;
      box-shadow:0 0 0 2px rgba(149,255,108,.9),0 0 32px rgba(106,255,77,.45);
      transition:.2s opacity;
    }
    .enter-hotspot:hover::after,
    .enter-hotspot:focus-visible::after{opacity:1}

    .mobile-enter{display:none}

    @keyframes stageIn{
      from{opacity:0;transform:scale(.99);filter:blur(5px) drop-shadow(0 20px 50px rgba(0,0,0,.45))}
      to{opacity:1;transform:scale(1);filter:blur(0) drop-shadow(0 20px 50px rgba(0,0,0,.45))}
    }
    @keyframes redBreathe{
      0%,100%{opacity:.10;transform:scale(.98)}
      50%{opacity:.20;transform:scale(1.025)}
    }
    @keyframes blueBreathe{
      0%,100%{opacity:.19;transform:scale(1.025)}
      50%{opacity:.10;transform:scale(.98)}
    }
    @keyframes cardGlint{
      0%,68%{left:-45%;opacity:0}
      74%{opacity:.68}
      90%{left:126%;opacity:.10}
      100%{left:126%;opacity:0}
    }
    @keyframes particleDrift{
      0%,100%{transform:translate3d(0,7px,0) scale(.72);opacity:.18}
      50%{transform:translate3d(3px,-8px,0) scale(1.05);opacity:.62}
    }
    @keyframes buttonBreathe{
      0%,100%{opacity:.35;transform:scale(.985)}
      50%{opacity:.82;transform:scale(1.025)}
    }

    @media(max-aspect-ratio:4/3){
      .splash{overflow:auto;padding:1rem 0 5.25rem}
      .stage{width:100vw;height:auto;max-height:none}
      .enter-hotspot{display:none}
      .energy{opacity:.10}
      .glint-zone{opacity:.34}
      .particle{opacity:.34}
      .mobile-enter{
        display:inline-flex;
        position:fixed;
        z-index:10;
        left:50%;
        bottom:max(1rem,env(safe-area-inset-bottom));
        transform:translateX(-50%);
        align-items:center;
        justify-content:center;
        min-width:210px;
        min-height:52px;
        padding:.9rem 1.3rem;
        border-radius:15px;
        border:1px solid #99ff71;
        background:linear-gradient(180deg,#a4ff7b,#5ce746);
        color:#061506;
        text-decoration:none;
        font-weight:800;
        box-shadow:0 0 26px rgba(93,255,71,.24);
        animation:mobileButtonBreathe 3.6s ease-in-out infinite;
      }
      @keyframes mobileButtonBreathe{
        0%,100%{box-shadow:0 0 18px rgba(93,255,71,.18)}
        50%{box-shadow:0 0 30px rgba(93,255,71,.32)}
      }
    }

    /* Auto-rotating splash presets. The approved artwork and navigation never change. */
    html[data-splash-preset="2"] .energy{filter:blur(28px)}
    html[data-splash-preset="2"] .energy-left{animation-duration:7.1s}
    html[data-splash-preset="2"] .energy-right{animation-duration:7.1s}
    html[data-splash-preset="2"] .glint-zone{opacity:.52}
    html[data-splash-preset="2"] .glint-zone::after{animation-duration:9.2s}
    html[data-splash-preset="2"] .particle{opacity:.42;animation-duration:calc(var(--d) * 1.16)}
    html[data-splash-preset="2"] .enter-hotspot::before{animation-duration:4.4s}

    html[data-splash-preset="3"] .energy{filter:blur(20px);opacity:.18}
    html[data-splash-preset="3"] .energy-left{animation-duration:6.6s}
    html[data-splash-preset="3"] .energy-right{animation-duration:6.6s}
    html[data-splash-preset="3"] .glint-zone{opacity:.72}
    html[data-splash-preset="3"] .glint-zone::after{animation-duration:8.3s}
    html[data-splash-preset="3"] .particle{opacity:.56;animation-duration:calc(var(--d) * 1.08)}
    html[data-splash-preset="3"] .enter-hotspot::before{
      animation-duration:4s;
      box-shadow:0 0 0 1px rgba(153,255,113,.16),0 0 17px rgba(93,255,71,.19)
    }

    @media(prefers-reduced-motion:reduce){
      .stage,.energy,.glint-zone::after,.particle,.enter-hotspot::before,.mobile-enter{animation:none!important}
    }
  </style>
</head>
<body>
  <main class="splash" aria-label="Slime's Collectables welcome page">
    <div class="stage">
      <img
        class="hero"
        src="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/bce857582ee01de064f104dc6627f4e91a41436e67b39724f3b2fdaa6ddb222d.png"
        alt="Slime's Collectables welcome artwork featuring Yu-Gi-Oh! and Pokémon collections">

      <div class="energy energy-left" aria-hidden="true"></div>
      <div class="energy energy-right" aria-hidden="true"></div>
      <div class="glint-zone glint-left" aria-hidden="true"></div>
      <div class="glint-zone glint-right" aria-hidden="true"></div>

      <i class="particle left"  style="--x:7%;--y:28%;--s:4px;--d:4.8s;--delay:-.8s"></i>
      <i class="particle left"  style="--x:17%;--y:63%;--s:3px;--d:5.6s;--delay:-2.1s"></i>
      <i class="particle left"  style="--x:31%;--y:19%;--s:3px;--d:4.4s;--delay:-3.0s"></i>
      <i class="particle left"  style="--x:36%;--y:70%;--s:4px;--d:6.2s;--delay:-1.4s"></i>
      <i class="particle left"  style="--x:24%;--y:42%;--s:2px;--d:5.1s;--delay:-4.0s"></i>

      <i class="particle right" style="--x:69%;--y:24%;--s:3px;--d:5.2s;--delay:-1.1s"></i>
      <i class="particle gold"  style="--x:78%;--y:67%;--s:3px;--d:5.9s;--delay:-2.8s"></i>
      <i class="particle right" style="--x:90%;--y:36%;--s:4px;--d:4.6s;--delay:-3.5s"></i>
      <i class="particle gold"  style="--x:84%;--y:17%;--s:2px;--d:5.4s;--delay:-.5s"></i>
      <i class="particle right" style="--x:64%;--y:72%;--s:3px;--d:6.1s;--delay:-4.2s"></i>

      <a class="enter-hotspot" href="/slime786/collectables/shop.html" aria-label="Enter Slime's Collectables shop"></a>
    </div>
    <a class="mobile-enter" href="/slime786/collectables/shop.html">Enter Site →</a>
  </main>
</body>
</html>
