name: Site automation
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Rebuild site index, sitemap, and validate internal links
        run: python tools/site_automation.py
      - name: Commit generated metadata when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-index.json sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh automated site metadata [skip ci]"
            git push
          fi
