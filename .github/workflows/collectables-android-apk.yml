name: Build Collectables Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/collectables-android-wrapper
    paths:
      - "android/collectables/**"
      - ".github/workflows/collectables-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        working-directory: android/collectables
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p apk-output
          cp android/collectables/app/build/outputs/apk/debug/app-debug.apk \
             apk-output/Slimes-Collectables-1.0.0.apk
          sha256sum apk-output/Slimes-Collectables-1.0.0.apk \
             > apk-output/Slimes-Collectables-1.0.0.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: slimes-collectables-android-apk
          path: apk-output/*
          if-no-files-found: error
          retention-days: 30
