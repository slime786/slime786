name: Portfolio smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: node scripts/sync-portfolio.mjs --check
      - run: node tests/portfolio-smoke.mjs
      - run: node tests/collectables-smoke.mjs

      - name: Verify Supabase source layout
        run: |
          test -f collectables/supabase/config.toml
          test -f collectables/supabase/migrations/20261004091955_collectables_checkout_hardening.sql
          test -f collectables/supabase/tests/order-flow-regression.sql
          test ! -e supabase/functions/collectables-create-order/index.ts
          test ! -e supabase/functions/collectables-capture-order/index.ts
          test ! -e supabase/functions/collectables-catalog/index.ts
          test ! -e supabase/functions/collectables-paypal-webhook/index.ts
          test ! -e supabase/functions/collectables-public-info/index.ts

      - name: Type-check Edge Functions
        run: |
          deno check collectables/supabase/functions/collectables-create-order/index.ts
          deno check collectables/supabase/functions/collectables-capture-order/index.ts
          deno check collectables/supabase/functions/collectables-catalog/index.ts
          deno check collectables/supabase/functions/collectables-paypal-webhook/index.ts
          deno check collectables/supabase/functions/collectables-public-info/index.ts
          deno check supabase/functions/slime-admin/index.ts
          deno check supabase/functions/slime-admin-mobile/index.ts
