name: Portfolio smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collectables_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d collectables_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: collectables_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: node tests/portfolio-smoke.mjs
      - run: node tests/collectables-smoke.mjs

      - name: Type-check Collectables Edge Functions
        run: |
          deno check collectables/supabase/functions/collectables-create-order/index.ts
          deno check collectables/supabase/functions/collectables-capture-order/index.ts
          deno check collectables/supabase/functions/collectables-catalog/index.ts
          deno check collectables/supabase/functions/collectables-paypal-webhook/index.ts
          deno check collectables/supabase/functions/collectables-public-info/index.ts

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Run Collectables database regression tests
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          SQL

          for migration in collectables/supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

          psql -v ON_ERROR_STOP=1 -f collectables/supabase/tests/order-flow-regression.sql
          psql -v ON_ERROR_STOP=1 -f collectables/supabase/tests/recovery-verification.sql
