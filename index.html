<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="slime786 — products, experiments and ideas by Moheen Mahmood.">
<title>slime786 — Enter</title>
<link rel="icon" href="/slime786/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#050508">
<style>
:root{
  --ink:#f5f7f4;
  --muted:#9ba49b;
  --lime:#b7ff2a;
  --acid:#77ff4a;
  --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050508;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100svh;overflow:hidden}
a{color:inherit;text-decoration:none}
.shell{
  position:relative;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;
  padding:clamp(22px,4vw,54px);isolation:isolate;
  background:
    radial-gradient(circle at 78% 24%,rgba(183,255,42,.10),transparent 26%),
    radial-gradient(circle at 18% 82%,rgba(119,255,74,.07),transparent 28%),
    #050508;
}
.noise{position:absolute;inset:0;pointer-events:none;opacity:.26;mix-blend-mode:soft-light;z-index:-1;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E")
}
.grid{position:absolute;inset:0;z-index:-2;opacity:.24;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(to bottom,transparent,black 18%,black 72%,transparent)}
.top,.foot{display:flex;align-items:center;justify-content:space-between;gap:20px;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.brand{font-weight:800;letter-spacing:-.02em;text-transform:none;font-size:15px}
.brand i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 22px var(--lime);margin-right:9px}
.status{color:var(--muted)} .status b{color:var(--lime);font-weight:600}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.55fr);align-items:center;gap:8vw;max-width:1500px;width:100%;margin:auto}
.kicker{color:var(--lime);font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 24px}
h1{font-size:clamp(72px,14vw,220px);line-height:.72;letter-spacing:-.08em;margin:0;font-weight:900}
h1 span{display:block;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.72)}
.copy{max-width:580px;margin-top:34px;color:#c8cec8;font-size:clamp(16px,1.5vw,21px);line-height:1.55}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border:1px solid var(--line);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;transition:.25s ease}
.btn.primary{background:var(--lime);color:#050508;border-color:var(--lime)}
.btn:hover{transform:translateY(-2px);border-color:rgba(183,255,42,.72);box-shadow:0 14px 40px rgba(0,0,0,.28)}
.orb-wrap{position:relative;display:grid;place-items:center;min-height:420px}
.orb{position:relative;width:min(34vw,420px);aspect-ratio:1;border-radius:42% 58% 66% 34% / 50% 39% 61% 50%;background:
radial-gradient(circle at 34% 28%,#e8ffad 0 4%,transparent 14%),
radial-gradient(circle at 62% 66%,#2d4a08 0 8%,transparent 32%),
linear-gradient(145deg,#d8ff77 0%,#8cff2b 36%,#2b5b09 70%,#091006 100%);
box-shadow:inset -38px -42px 80px rgba(0,0,0,.55),inset 24px 20px 36px rgba(255,255,255,.12),0 0 90px rgba(183,255,42,.18);
animation:morph 8s ease-in-out infinite alternate,float 5s ease-in-out infinite
}
.orb:before,.orb:after{content:"";position:absolute;border-radius:50%;background:rgba(5,5,8,.82);filter:blur(.2px)}
.orb:before{width:12%;height:15%;left:28%;top:33%;box-shadow:88px 22px 0 rgba(5,5,8,.82),44px 94px 0 -8px rgba(5,5,8,.52)}
.orb:after{width:19%;height:6%;left:42%;top:62%;border-radius:0 0 90px 90px;transform:rotate(7deg)}
.ring{position:absolute;width:min(42vw,520px);aspect-ratio:1;border:1px solid rgba(183,255,42,.28);border-radius:50%;animation:spin 18s linear infinite}
.ring:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--lime);top:50%;left:-5px;box-shadow:0 0 18px var(--lime)}
.tag{position:absolute;right:4%;bottom:9%;padding:10px 12px;border:1px solid var(--line);background:rgba(5,5,8,.5);backdrop-filter:blur(10px);font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;color:#d9ded8}
.foot{color:#7f887f}.foot a{color:#c8cec8}.foot a:hover{color:var(--lime)}
@keyframes morph{to{border-radius:58% 42% 35% 65% / 42% 58% 42% 58%;transform:rotate(4deg) scale(1.02)}}
@keyframes float{50%{translate:0 -12px}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:850px){
  body{overflow:auto}.shell{min-height:100svh}.hero{grid-template-columns:1fr;padding:9vh 0 6vh}.orb-wrap{min-height:280px;order:-1}.orb{width:min(72vw,330px)}.ring{width:min(86vw,400px)}h1{font-size:clamp(64px,25vw,130px)}.copy{max-width:42ch}.foot{align-items:flex-end;flex-direction:column;text-align:right}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.orb,.ring{animation:none}}
</style>
</head>
<body>
<main class="shell">
  <div class="noise"></div><div class="grid"></div>
  <header class="top">
    <a class="brand" href="/slime786/"><i></i>slime786</a>
    <div class="status">Portfolio <b>/ online</b></div>
  </header>

  <section class="hero" aria-labelledby="splash-title">
    <div>
      <p class="kicker">Products · experiments · ideas</p>
      <h1 id="splash-title">SLIME<span>786</span></h1>
      <p class="copy">A digital playground by Moheen Mahmood — building useful software, testing ideas and shipping things that deserve to exist.</p>
      <div class="actions">
        <a class="btn primary" href="/slime786/portfolio.html">Enter site →</a>
        <a class="btn" href="https://github.com/slime786" target="_blank" rel="noopener">GitHub ↗</a>
      </div>
    </div>
    <div class="orb-wrap" aria-hidden="true">
      <div class="ring"></div>
      <div class="orb"></div>
      <div class="tag">S786 // BUILD MODE</div>
    </div>
  </section>

  <footer class="foot">
    <span>© 2026 Moheen Mahmood</span>
    <span>London, UK · <a href="/slime786/portfolio.html#work">View products</a></span>
  </footer>
</main>
</body>
</html>
