name: Weekly finance brief
on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_finance_brief.py
      - name: Commit refreshed edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsletter-latest.json
          git diff --cached --quiet || git commit -m "chore: refresh weekly finance brief"
          git push
