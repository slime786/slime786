<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Welcome to Slime's Collectables — a personal UK Yu-Gi-Oh! and Pokémon TCG collection shop.">
  <meta name="theme-color" content="#05090a">
  <title>Welcome — Slime's Collectables</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#030608}
    body{min-height:100svh;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
    .splash{
      position:relative;
      min-height:100svh;
      display:grid;
      place-items:center;
      overflow:hidden;
      background:
        radial-gradient(circle at 18% 42%,rgba(255,56,91,.12),transparent 28%),
        radial-gradient(circle at 82% 42%,rgba(47,164,255,.14),transparent 30%),
        #030608;
    }
    .stage{
      position:relative;
      width:min(100vw,calc(100svh * 1672 / 941));
      aspect-ratio:1672/941;
      max-height:100svh;
      filter:drop-shadow(0 20px 50px rgba(0,0,0,.45));
      animation:stageIn .8s cubic-bezier(.2,.8,.2,1) both, stageFloat 12s ease-in-out 1s infinite;
      transform-origin:center;
    }
    .hero{
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      user-select:none;
      -webkit-user-drag:none;
    }
    .enter-hotspot{
      position:absolute;
      left:50%;
      top:74.1%;
      width:18.4%;
      height:8.1%;
      transform:translate(-50%,-50%);
      border-radius:20px;
      text-decoration:none;
      outline:none;
      cursor:pointer;
    }
    .enter-hotspot::after{
      content:"";
      position:absolute;
      inset:-8%;
      border-radius:22px;
      opacity:0;
      box-shadow:0 0 0 2px rgba(149,255,108,.9),0 0 32px rgba(106,255,77,.45);
      transition:.2s opacity;
    }
    .enter-hotspot:hover::after,
    .enter-hotspot:focus-visible::after{opacity:1}
    .mobile-enter{display:none}
    @keyframes stageIn{
      from{opacity:0;transform:scale(.985);filter:blur(8px) drop-shadow(0 20px 50px rgba(0,0,0,.45))}
      to{opacity:1;transform:scale(1);filter:blur(0) drop-shadow(0 20px 50px rgba(0,0,0,.45))}
    }
    @keyframes stageFloat{
      0%,100%{transform:translateY(0) scale(1)}
      50%{transform:translateY(-4px) scale(1.003)}
    }
    @media(max-aspect-ratio:4/3){
      .splash{overflow:auto;padding:1rem 0 5.25rem}
      .stage{width:100vw;height:auto;max-height:none;animation:stageIn .8s cubic-bezier(.2,.8,.2,1) both}
      .enter-hotspot{display:none}
      .mobile-enter{
        display:inline-flex;
        position:fixed;
        z-index:5;
        left:50%;
        bottom:max(1rem,env(safe-area-inset-bottom));
        transform:translateX(-50%);
        align-items:center;
        justify-content:center;
        min-width:210px;
        min-height:52px;
        padding:.9rem 1.3rem;
        border-radius:15px;
        border:1px solid #99ff71;
        background:linear-gradient(180deg,#a4ff7b,#5ce746);
        color:#061506;
        text-decoration:none;
        font-weight:800;
        box-shadow:0 0 34px rgba(93,255,71,.3);
      }
    }
    @media(prefers-reduced-motion:reduce){
      .stage{animation:none}
    }
  </style>
</head>
<body>
  <main class="splash" aria-label="Slime's Collectables welcome page">
    <div class="stage">
      <img
        class="hero"
        src="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/bce857582ee01de064f104dc6627f4e91a41436e67b39724f3b2fdaa6ddb222d.png"
        alt="Slime's Collectables welcome artwork featuring Yu-Gi-Oh! and Pokémon collections">
      <a class="enter-hotspot" href="/slime786/collectables/shop.html" aria-label="Enter Slime's Collectables shop"></a>
    </div>
    <a class="mobile-enter" href="/slime786/collectables/shop.html">Enter Site →</a>
  </main>
</body>
</html>
